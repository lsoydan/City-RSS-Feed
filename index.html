<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-B65HYD2H60"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-B65HYD2H60');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City of Chattanooga News & Updates</title>

  <!-- Chattanooga Brand Google Fonts: Gabarito (Headers/Buttons), Inter (Body), Instrument Sans (Accents) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@500;600;700;800&family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Chattanooga Primary Palette */
      --cha-blue: #004360;
      --bridge-blue: #00A3BD;
      --sky-blue: #00D3EB;
      --cha-green: #008E52;
      --tree-city-green: #34CF59;
      --spring-green: #8FFF99;

      /* Chattanooga Secondary / Neutral Palette */
      --sunset-orange: #FA6D5C;
      --choo-choo-red: #D02301;
      --daylight-gold: #FFB949;
      --city-brick: #93000B;
      --stucco-yellow: #FFFDB1;
      --stone-brown: #CE8A48;
      --canvas-white: #F5F5EC;
      --industrial-black: #302C2B;
      --pure-white: #FFFFFF;

      /* Semantic Tokens */
      --bg-page: var(--canvas-white);
      --bg-card: var(--pure-white);
      --ink-primary: var(--industrial-black);
      --ink-secondary: #4A4644;
      --ink-muted: #6E6A68;
      --border-light: #E2E1D8;
      --border-strong: #CECDC2;

      /* Brand Typography */
      --font-header: 'Gabarito', sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-accent: 'Instrument Sans', sans-serif;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-page);
      color: var(--ink-primary);
      margin: 0;
      padding: 0;
      top: 0 !important;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open {
      overflow: hidden;
    }

    h1, h2, h3, h4, button, .nav-btn, .pill-btn, .hero-search-btn, .load-more-btn, .category-badge {
      font-family: var(--font-header);
    }

    /* Hide Google Translate Top Bar */
    .goog-te-banner-frame.skiptranslate,
    .goog-te-gadget span,
    .goog-logo-link {
      display: none !important;
    }
    .goog-te-gadget {
      color: transparent !important;
    }
    #google_translate_element {
      position: absolute;
      top: -9999px;
    }

    /* 1. Top Navigation Bar */
    .navbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink-primary);
    }

    .nav-logo {
      height: 42px;
      width: auto;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-accent);
      font-size: 13px;
      font-weight: 600;
      color: var(--cha-blue);
      background: var(--canvas-white);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .lang-pill:hover {
      border-color: var(--cha-blue);
    }

    .lang-pill input {
      accent-color: var(--cha-blue);
      cursor: pointer;
      margin: 0;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border: 1.5px solid var(--cha-blue);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--cha-blue);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s, color 0.15s;
    }

    .nav-btn:hover {
      background: var(--cha-blue);
      color: var(--pure-white);
    }

    /* 2. Hero Section (Solid CHA Blue, no gradients) */
    .hero {
      background-color: var(--cha-blue);
      color: var(--pure-white);
      padding: 64px 24px;
      text-align: center;
      position: relative;
    }

    .hero-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.65rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      margin: 0 0 12px 0;
      color: var(--pure-white);
      line-height: 1.15;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--canvas-white);
      margin: 0 0 28px 0;
      font-weight: 400;
    }

    .hero-search-form {
      display: flex;
      max-width: 620px;
      margin: 0 auto;
      background: var(--pure-white);
      border: 2px solid var(--pure-white);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.16);
    }

    .hero-search-input {
      flex: 1;
      border: none;
      padding: 14px 18px;
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--ink-primary);
      background: var(--pure-white);
      outline: none;
    }

    .hero-search-input::placeholder {
      color: var(--ink-muted);
      font-style: italic;
    }

    .hero-search-btn {
      background-color: var(--bridge-blue);
      color: var(--pure-white);
      border: none;
      padding: 0 30px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .hero-search-btn:hover {
      background-color: #008CA3;
    }

    /* Main Container */
    .main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 68px 24px;
    }

    /* 3. Filter Bar (Category Pills + Department Dropdown) */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .category-pills {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn {
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--ink-primary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      border-color: var(--cha-blue);
      color: var(--cha-blue);
    }

    .pill-btn.active {
      background-color: var(--cha-blue);
      color: var(--pure-white);
      border-color: var(--cha-blue);
    }

    .dept-select {
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--ink-primary);
      font-family: var(--font-body);
      font-size: 13.5px;
      font-weight: 500;
      min-width: 225px;
      cursor: pointer;
      outline: none;
    }

    .dept-select:focus {
      border-color: var(--cha-blue);
    }

    /* Shared Card Header / Badge / Meta / Footer Atoms */
    .dept-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .dept-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .dept-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: var(--cha-blue);
      color: var(--pure-white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .dept-text {
      min-width: 0;
    }

    .dept-name {
      font-family: var(--font-accent);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .post-date {
      font-family: var(--font-body);
      font-size: 11px;
      color: var(--ink-muted);
      display: block;
    }

    /* Category Badges using Chattanooga Brand Palette */
    .category-badge {
      background-color: var(--cha-blue);
      color: var(--pure-white);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 4px 12px;
      border-radius: var(--radius-sm);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .category-badge[data-cat="Events"] {
      background-color: var(--bridge-blue);
      color: var(--pure-white);
    }

    .category-badge[data-cat="News"] {
      background-color: var(--cha-blue);
      color: var(--pure-white);
    }

    .category-badge[data-cat="Resources"] {
      background-color: var(--cha-green);
      color: var(--pure-white);
    }

    .category-badge[data-cat="Jobs"] {
      background-color: var(--daylight-gold);
      color: var(--industrial-black);
    }

    .card-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
      font-family: var(--font-accent);
      font-size: 12px;
      font-weight: 500;
      color: var(--ink-secondary);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .meta-item svg {
      width: 14px;
      height: 14px;
      color: var(--bridge-blue);
      flex-shrink: 0;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
    }

    .action-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-header);
      font-size: 13px;
      font-weight: 600;
      color: var(--cha-blue);
      text-decoration: none;
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
    }

    .action-link:hover {
      color: var(--bridge-blue);
      text-decoration: underline;
    }

    .action-link svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    /* 4. Featured Post Card (Top Split Card) */
    .featured-section {
      margin-bottom: 32px;
    }

    .featured-card {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(48, 44, 43, 0.05);
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .featured-card:hover {
      transform: translateY(-2px);
      border-color: var(--bridge-blue);
      box-shadow: 0 10px 24px rgba(0, 67, 96, 0.1);
    }

    .featured-media {
      background-color: #E7E6DC;
      min-height: 320px;
      position: relative;
      overflow: hidden;
    }

    .featured-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .featured-body {
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .featured-title {
      font-size: 1.7rem;
      font-weight: 700;
      margin: 18px 0 10px 0;
      line-height: 1.22;
      color: var(--ink-primary);
    }

    .featured-excerpt {
      font-size: 0.95rem;
      color: var(--ink-secondary);
      margin: 0;
      line-height: 1.6;
    }

    /* 5. 3-Column Post Grid (Banner on top, Image directly below) */
    .posts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }

    .post-card:hover {
      transform: translateY(-3px);
      border-color: var(--bridge-blue);
      box-shadow: 0 10px 22px rgba(0, 67, 96, 0.1);
    }

    .card-header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: var(--pure-white);
      border-bottom: 1px solid var(--border-light);
    }

    .card-media-wrapper {
      height: 196px;
      background-color: #E7E6DC;
      border-bottom: 1px solid var(--border-light);
      overflow: hidden;
    }

    .card-media-wrapper.no-image {
      display: none;
    }

    .card-media-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 8px 0;
      color: var(--ink-primary);
      line-height: 1.3;
    }

    .card-excerpt {
      font-size: 0.88rem;
      color: var(--ink-secondary);
      margin: 0;
      line-height: 1.55;
      flex: 1;
    }

    /* 6. Load More Button & Status */
    .load-more-wrap {
      text-align: center;
      margin-top: 40px;
    }

    .load-more-btn {
      background-color: var(--cha-blue);
      color: var(--pure-white);
      border: none;
      padding: 12px 46px;
      border-radius: var(--radius-pill);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .load-more-btn:hover {
      background-color: var(--bridge-blue);
    }

    .load-more-btn.hidden {
      display: none;
    }

    #status-msg {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-secondary);
      font-size: 15px;
    }

    /* 7. Footer (Solid CHA Blue) */
    .site-footer {
      background-color: var(--cha-blue);
      color: var(--canvas-white);
      padding: 40px 32px;
      font-size: 13.5px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .footer-inner strong {
      font-family: var(--font-header);
      font-size: 15px;
      color: var(--pure-white);
    }

    .footer-links {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-family: var(--font-header);
      color: var(--sky-blue);
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      color: var(--pure-white);
      text-decoration: underline;
    }

    /* 8. Pop-up Detail Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(48, 44, 43, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 500;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-dialog {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      width: 100%;
      max-width: 960px;
      max-height: 88vh;
      display: grid;
      grid-template-columns: 1.05fr 1fr;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 48px rgba(48, 44, 43, 0.28);
      animation: modalFadeIn 0.18s ease-out;
    }

    .modal-dialog.no-image {
      grid-template-columns: 1fr;
      max-width: 620px;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      background: var(--pure-white);
      color: var(--ink-primary);
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background-color 0.15s, color 0.15s, border-color 0.15s;
    }

    .modal-close:hover {
      background-color: var(--cha-blue);
      border-color: var(--cha-blue);
      color: var(--pure-white);
    }

    .modal-media {
      background-color: #E7E6DC;
      border-right: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      min-height: 360px;
      max-height: 88vh;
    }

    .modal-dialog.no-image .modal-media {
      display: none;
    }

    .modal-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-details {
      padding: 28px 32px 24px 32px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      max-height: 88vh;
    }

    .modal-details .dept-header {
      padding-right: 34px;
    }

    .modal-title {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.22;
      margin: 20px 0 14px 0;
      color: var(--ink-primary);
    }

    .modal-body-text {
      font-size: 0.95rem;
      color: var(--ink-secondary);
      line-height: 1.65;
      margin: 0;
      flex: 1;
    }

    .modal-body-text p {
      margin: 0 0 14px 0;
    }

    .modal-body-text p:last-child {
      margin-bottom: 0;
    }

    .modal-details .card-meta-row {
      margin-top: 20px;
      padding-top: 14px;
    }

    .modal-details .card-actions {
      margin-top: 22px;
      padding-top: 16px;
    }

    /* Toast Notification for Copy Link */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background-color: var(--cha-green);
      color: var(--pure-white);
      padding: 11px 20px;
      border-radius: var(--radius-sm);
      font-family: var(--font-header);
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.2s, transform 0.2s;
      z-index: 999;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive Breakpoints */
    @media (max-width: 960px) {
      .featured-card {
        grid-template-columns: 1fr;
      }
      .featured-media {
        min-height: 240px;
      }
      .posts-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .modal-dialog {
        grid-template-columns: 1fr;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-media {
        min-height: 220px;
        max-height: 300px;
        border-right: none;
        border-bottom: 1px solid var(--border-light);
      }
      .modal-details {
        max-height: none;
        overflow-y: visible;
      }
    }

    @media (max-width: 640px) {
      .navbar {
        padding: 12px 16px;
      }
      .hero {
        padding: 44px 16px;
      }
      .hero h1 {
        font-size: 1.9rem;
      }
      .hero-search-form {
        flex-direction: column;
      }
      .hero-search-btn {
        padding: 13px;
      }
      .posts-grid {
        grid-template-columns: 1fr;
      }
      .dept-select {
        width: 100%;
      }
      .modal-backdrop {
        padding: 12px;
      }
      .modal-details {
        padding: 20px;
      }
    }
  </style>
</head>

<body>
  <div id="google_translate_element"></div>

  <!-- 1. Top Navigation -->
  <header class="navbar">
    <a href="#" class="nav-brand" onclick="resetAllFilters(); return false;">
      <img src="logo.png" alt="City of Chattanooga Logo" class="nav-logo">
    </a>

    <div class="nav-actions">
      <label class="lang-pill" title="Translate page to Spanish">
        <input type="checkbox" id="langToggle" onchange="toggleLanguage()">
        <span>Español</span>
      </label>
      <a href="https://chattanooga.gov" target="_blank" rel="noopener" class="nav-btn">City website</a>
      <a href="
