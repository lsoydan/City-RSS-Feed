  <title>City of Chattanooga News & Updates</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-placeholder: #e2e8f0;
      --ink-primary: #18181b;
      --ink-secondary: #52525b;
      --ink-muted: #71717a;
      --border-light: #e4e4e7;
      --border-strong: #d4d4d8;
      --accent-dark: #18181b;
      --accent-navy: #004360;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink-primary);
      margin: 0;
      padding: 0;
      top: 0 !important;
      line-height: 1.5;
    }

    body.modal-open {
      overflow: hidden;
    }

    /* Hide Google Translate Top Bar */
    .goog-te-banner-frame.skiptranslate,
    .goog-te-gadget span,
    .goog-logo-link {
      display: none !important;
    }
    .goog-te-gadget {
      color: transparent !important;
    }
    #google_translate_element {
      position: absolute;
      top: -9999px;
    }

    /* 1. Top Navigation Bar */
    .navbar {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-light);
      padding: 14px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--ink-primary);
    }

    .nav-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lang-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-secondary);
      background: #fafafa;
      cursor: pointer;
    }

    .lang-pill input {
      accent-color: var(--accent-dark);
      cursor: pointer;
      margin: 0;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--ink-primary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
    }

    .nav-btn:hover {
      background: #f4f4f5;
      border-color: var(--ink-primary);
    }

    /* 2. Hero Section (Image-ready placeholder) */
    .hero {
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
      border-bottom: 1px solid var(--border-strong);
      padding: 64px 24px;
      text-align: center;
      position: relative;
    }

    .hero-inner {
      max-width: 720px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 10px 0;
      color: var(--ink-primary);
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--ink-secondary);
      margin: 0 0 28px 0;
    }

    .hero-search-form {
      display: flex;
      max-width: 620px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .hero-search-input {
      flex: 1;
      border: none;
      padding: 14px 18px;
      font-size: 15px;
      color: var(--ink-primary);
      outline: none;
      font-style: italic;
    }
